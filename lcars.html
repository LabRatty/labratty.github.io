  <style>
    html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}
    svg{width:100%;height:100%;display:block}
    text{font-family:'League Gothic','Arial Narrow',sans-serif;font-weight:400;letter-spacing:.3px}
    .softblink{animation:softblink 4.8s ease-in-out infinite alternate}
    .softblink2{animation:softblink 6.2s ease-in-out infinite alternate}
    .diagBar{transform-box:fill-box;transform-origin:left center;animation:barpulse 5.5s ease-in-out infinite alternate}
    .monitorBar{transform-box:fill-box;transform-origin:bottom center;animation:barY 2.8s ease-in-out infinite alternate}
    .spin{transform-box:fill-box;transform-origin:center center;animation:spin 26s linear infinite}
    .pulseNode{animation:pulseNode 3s ease-in-out infinite}
    .scanSweep{animation:sweep 7s ease-in-out infinite}
    .tilePulse{animation:tilePulse 5s ease-in-out infinite}
    .sidePulse{animation:sidePulse 7s ease-in-out infinite}
    @keyframes softblink{0%,35%{opacity:.45}100%{opacity:1}}
    @keyframes barpulse{0%{opacity:.45}100%{opacity:1}}
    @keyframes barY{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulseNode{0%,100%{opacity:.6;r:6}50%{opacity:1;r:8}}
    @keyframes sweep{0%,20%{opacity:0;transform:translateX(-18px)}25%,75%{opacity:.75}100%{opacity:0;transform:translateX(18px)}}
    @keyframes tilePulse{0%,100%{opacity:.75}50%{opacity:1}}
    @keyframes sidePulse{0%,85%,100%{filter:none;opacity:1}90%{filter:brightness(1.25);opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</head>

<script>
(function(){
  const timeText=document.getElementById('timeText');
  const ampmText=document.getElementById('ampmText');
  const dateText=document.getElementById('dateText');
  const hourBar=document.getElementById('hourBar');
  const minuteBar=document.getElementById('minuteBar');
  const secondBar=document.getElementById('secondBar');

  function makeRect(x,y,w,h,fill,rx=0){
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h);
    r.setAttribute('fill',fill); if(rx) r.setAttribute('rx',rx); return r;
  }

  function buildBars(now){
    hourBar.innerHTML=''; minuteBar.innerHTML=''; secondBar.innerHTML='';
    const hourProgress=(now.getHours()+now.getMinutes()/60)/24;
    const minute=now.getMinutes();
    const second=now.getSeconds();
    // hour bar 12 chunky segments
    const startX=300, y1=282, w=710, h=24;
    const segW=(w-11*3)/12;
    for(let i=0;i<12;i++){
      const x=startX+i*(segW+3);
      const fillFrac=Math.max(0, Math.min(1, hourProgress*12 - i));
      const bg=makeRect(x,y1,segW,h,'#3d2f42',8); hourBar.appendChild(bg);
      if(fillFrac>0){
        const fg=makeRect(x,y1,Math.max(0,segW*fillFrac),h,i<9?'#efb25a':'#6a586f',8);
        fg.setAttribute('class','diagBar'); fg.style.animationDelay=`-${i*.25}s`; hourBar.appendChild(fg);
      }
    }
    // minute and second bars 60 cells each
    function cellBar(group, y, count, activeCount, color){
      const gap=2, cellW=(w-59*gap)/60;
      for(let i=0;i<60;i++){
        const x=startX+i*(cellW+gap);
        const bg=makeRect(x,y,cellW,h,'#2d2332',4); group.appendChild(bg);
        if(i<activeCount){
          const fg=makeRect(x,y,cellW,h,color,4);
          fg.setAttribute('class','diagBar'); fg.style.animationDelay=`-${i*.05}s`; group.appendChild(fg);
        }
      }
    }
    cellBar(minuteBar,314,60,minute,'#c8a1f2');
    cellBar(secondBar,346,60,second,'#a57ecc');
  }

  function updateClock(){
    const now=new Date();
    let h=now.getHours(); const m=String(now.getMinutes()).padStart(2,'0');
    const ampm=h>=12?'PM':'AM';
    h=h%12; if(h===0) h=12;
    timeText.textContent=`${h}:${m}`;
    const digits=String(h).length + 1 + 2; // rough offset
    ampmText.setAttribute('x', h<10? 595 : 640);
    ampmText.textContent=ampm;
    const date=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'}).format(now);
    dateText.textContent=date.replace(/^(.)/,c=>c.toUpperCase());
    buildBars(now);
  }
  updateClock(); setInterval(updateClock,1000);
})();
</script>
