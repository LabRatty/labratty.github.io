<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap"><style>html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}svg{width:100%;height:100%;display:block}text{font-family:'League Gothic','Arial Narrow',sans-serif;font-weight:400}.flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}.reverse{animation-direction:reverse}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></head><body><svg viewBox="0 0 900 245" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><g font-size="17" fill="#000"><rect x="4" y="3" width="374" height="21" rx="10" fill="#cc8271"/><text x="17" y="18">LIVE POWER DISTRIBUTION</text><rect x="390" y="3" width="506" height="21" rx="10" fill="#ffb65d"/><text x="404" y="18">ENERGY PRODUCTION CYCLE</text></g><g text-anchor="middle"><g fill="#ffb65d"><text x="88" y="44" font-size="17">SOLAR ARRAY</text><text id="solar" x="88" y="76" font-size="34">—</text></g><g fill="#cc99cc"><text x="290" y="44" font-size="17">POWER GRID</text><text id="grid" x="290" y="76" font-size="34">—</text><text id="status" x="290" y="91" font-size="13">—</text></g><g fill="#ffcc99"><text x="189" y="130" font-size="17">FACILITY LOAD</text><text id="home" x="189" y="168" font-size="40">—</text></g></g><g fill="none" stroke-width="2.5"><path d="M88 83 V103 H189 V113" stroke="#503b27"/><path d="M290 94 V103 H189 V113" stroke="#45334d"/><path id="sf" class="flow" d="M88 83 V103 H189 V113" stroke="#ffaa55"/><path id="gf" class="flow" d="M290 94 V103 H189 V113" stroke="#cc99cc"/></g><g id="chart"/><g font-size="13"><text x="438" y="196" fill="#ffaa55">● SOLAR ARRAY</text><text x="660" y="196" fill="#cc99cc">● FACILITY LOAD</text></g><path d="M4 199 H896" stroke="#cc8271" stroke-width="2"/><g text-anchor="middle"><g fill="#ffb65d"><text x="110" y="212" font-size="13">SOLAR GENERATED</text><text id="solarTotal" x="110" y="234" font-size="24">—</text></g><g fill="#ffcc99"><text x="333" y="212" font-size="13">ENERGY CONSUMED</text><text id="homeTotal" x="333" y="234" font-size="24">—</text></g><g fill="#cc99cc"><text x="558" y="212" font-size="13">GRID IN / OUT</text><text id="gridTotal" x="558" y="234" font-size="23">—</text></g><g fill="#ffcc99"><text x="786" y="212" font-size="13">LIVE SOLAR COVERAGE</text><text id="coverage" x="786" y="234" font-size="24">—</text></g><text id="period" x="450" y="244" fill="#a184d6" font-size="10">RECORDED INTERVAL TOTALS</text></g></svg><script>const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg',tz='America/Los_Angeles';const fmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});const day=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});const kw=v=>Number.isFinite(v)?v/1000:NaN;const power=v=>Number.isFinite(v)?v.toFixed(2)+' kW':'—';const energy=v=>v.toFixed(2)+' kWh';function put(id,v){$(id).textContent=v}function hour(t){let a=fmt.format(new Date(t)).split(':').map(Number);return a[0]+a[1]/60}function node(p,t,a,v){let n=document.createElementNS(ns,t);for(let k in a)n.setAttribute(k,a[k]);if(v!==undefined)n.textContent=v;p.append(n)}async function read(name){let r=await fetch(name+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(name);let d=await r.json();if(!d.ok)throw Error(name);return d}function live(d){let s=kw(d.solar_kw),h=kw(d.home_kw),g=kw(d.grid_kw),status=d.grid_status||'';put('solar',power(s));put('home',power(h));put('grid',power(Math.abs(g)));put('status',status.toUpperCase());put('coverage',h>0&&Number.isFinite(s)?Math.min(100,Math.max(0,s/h*100)).toFixed(0)+'%':'—');$('gf').classList.toggle('reverse',/export/i.test(status));$('gf').style.opacity=Math.abs(g)>.005?1:0;$('sf').style.opacity=s>.005?1:0}function graph(d,sun){let p=d.points.map(q=>({t:new Date(q.time).getTime(),s:kw(q.solar_kw),h:kw(q.home_kw)})).filter(q=>Number.isFinite(q.t)&&Number.isFinite(q.s)&&Number.isFinite(q.h)).sort((a,b)=>a.t-b.t);if(!p.length)return;let date=day.format(new Date(p.at(-1).t));p=p.filter(q=>day.format(new Date(q.t))===date);let c=$('chart');c.replaceChildren();let x=t=>420+hour(t)/24*462, max=Math.max(1,Math.ceil(Math.max(...p.flatMap(q=>[q.s,q.h])))),y=v=>169-Math.max(0,v)/max*135;for(let i=0;i<=4;i++){let v=max*i/4;node(c,'path',{d:`M420 ${y(v)} H882`,stroke:'#433340','stroke-width':1});node(c,'text',{x:414,y:y(v)+4,fill:'#cc99cc','font-size':12,'text-anchor':'end'},v.toFixed(1))}for(let i=0;i<=4;i++){let xx=420+i*462/4;node(c,'path',{d:`M${xx} 34 V169`,stroke:'#433340'});node(c,'text',{x:xx,y:183,fill:'#cc99cc','font-size':13,'text-anchor':'middle'},String(i*6).padStart(2,'0')+':00')}if(sun&&sun.date===date){for(let k of ['sunrise','sunset']){let xx=x(sun[k]);node(c,'path',{d:`M${xx} 34 V169`,stroke:'#cc7766','stroke-dasharray':'4 4'});node(c,'text',{x:xx,y:31,fill:'#cc7766','font-size':13,'text-anchor':'middle'},fmt.format(new Date(sun[k])))}}let totals=[0,0,0,0],covered=0;for(let key of ['s','h']){let path='';p.forEach((q,i)=>{path+=(i&&q.t-p[i-1].t<=10*60000?'L':'M')+x(q.t)+' '+y(q[key])+' '});node(c,'path',{d:path,stroke:key==='s'?'#ffaa55':'#cc99cc','stroke-width':2,fill:'none'})}for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i],dt=(b.t-a.t)/3600000;if(dt<=0||dt>1/6)continue;covered+=dt;totals[0]+=(a.s+b.s)/2*dt;totals[1]+=(a.h+b.h)/2*dt;let g1=a.h-a.s,g2=b.h-b.s;for(let j=0;j<2;j++){let u=(j? -1:1)*g1,v=(j?-1:1)*g2;totals[2+j]+=u*v>=0?(Math.max(0,u)+Math.max(0,v))*dt/2:Math.max(u,v)**2/(2*Math.abs(u-v))*dt}}if(covered>0){put('solarTotal',energy(totals[0]));put('homeTotal',energy(totals[1]));put('gridTotal',totals[2].toFixed(2)+' / '+totals[3].toFixed(2)+' kWh')}put('period',date+' · RECORDED INTERVAL TOTALS · '+fmt.format(new Date(p[0].t))+'–'+fmt.format(new Date(p.at(-1).t))+' · '+covered.toFixed(1)+' h covered')}
let busy=false;async function refresh(){if(busy)return;busy=true;try{let [a,b,c]=await Promise.allSettled(['latest.json','solar_today.json','sun_times.json'].map(read));if(a.status==='fulfilled')live(a.value);if(b.status==='fulfilled')graph(b.value,c.status==='fulfilled'?c.value:null)}finally{busy=false}}refresh();setInterval(refresh,30000);</script></body></html>
