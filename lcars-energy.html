<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap"><style>html,body{margin:0;background:black;color:#ffcc99;width:100%;height:100%;overflow:hidden;font-family:'League Gothic','Arial Narrow',sans-serif}svg{width:100%;height:100%;display:block}text{font-family:inherit}.flow{stroke-dasharray:5 12;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-34}}.reverse{animation-direction:reverse}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></head><body><svg viewBox="0 0 900 470" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><g font-size="23" font-weight="normal" fill="#000"><rect x="8" y="8" width="355" height="30" rx="15" fill="#cc7766"/><text x="24" y="29">LIVE POWER DISTRIBUTION</text><rect x="390" y="8" width="502" height="30" rx="15" fill="#ffaa55"/><text x="406" y="29">ENERGY PRODUCTION CYCLE</text></g><g font-size="22" fill="#ffaa55" text-anchor="middle"><text x="82" y="70">SOLAR ARRAY</text><text id="solar" x="82" y="116" font-size="46">—</text></g><g font-size="22" fill="#cc99cc" text-anchor="middle"><text x="290" y="70">POWER GRID</text><text id="grid" x="290" y="116" font-size="46">—</text><text id="status" x="290" y="134" font-size="17">—</text></g><g fill="none" stroke-width="3"><path d="M82 135 V174 H186 V207" stroke="#503b27"/><path d="M290 145 V174 H186 V207" stroke="#45334d"/><path id="sf" class="flow" d="M82 135 V174 H186 V207" stroke="#ffaa55"/><path id="gf" class="flow" d="M290 145 V174 H186 V207" stroke="#cc99cc"/></g><g fill="#ffcc99" text-anchor="middle"><text x="186" y="230" font-size="23">FACILITY LOAD</text><text id="home" x="186" y="286" font-size="57">—</text></g><g id="chart"/><g font-size="20"><text x="400" y="332" fill="#ffaa55">● SOLAR ARRAY</text><text x="590" y="332" fill="#cc99cc">● FACILITY LOAD</text></g><path d="M8 350 H892" stroke="#cc7766" stroke-width="5"/><g text-anchor="middle"><g fill="#ffaa55"><text x="114" y="378" font-size="20">SOLAR GENERATED</text><text id="solarTotal" x="114" y="424" font-size="39">—</text></g><g fill="#ffcc99"><text x="337" y="378" font-size="20">ENERGY CONSUMED</text><text id="homeTotal" x="337" y="424" font-size="39">—</text></g><g fill="#cc99cc"><text x="562" y="378" font-size="20">GRID IN / OUT</text><text id="gridTotal" x="562" y="424" font-size="34">—</text></g><g fill="#ffcc99"><text x="786" y="378" font-size="20">LIVE SOLAR COVERAGE</text><text id="coverage" x="786" y="424" font-size="39">—</text></g><text id="period" x="450" y="458" fill="#9977cc" font-size="17">RECORDED INTERVAL TOTALS</text></g></svg><script>const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg',tz='America/Los_Angeles';const fmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});const day=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});const kw=v=>Number.isFinite(v)?v/1000:NaN;const power=v=>Number.isFinite(v)?v.toFixed(2)+' kW':'—';const energy=v=>v.toFixed(2)+' kWh';function put(id,v){$(id).textContent=v}function hour(t){let a=fmt.format(new Date(t)).split(':').map(Number);return a[0]+a[1]/60}function node(p,t,a,v){let n=document.createElementNS(ns,t);for(let k in a)n.setAttribute(k,a[k]);if(v!==undefined)n.textContent=v;p.append(n)}async function read(name){let r=await fetch(name+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(name);let d=await r.json();if(!d.ok)throw Error(name);return d}function live(d){let s=kw(d.solar_kw),h=kw(d.home_kw),g=kw(d.grid_kw),status=d.grid_status||'';put('solar',power(s));put('home',power(h));put('grid',power(Math.abs(g)));put('status',status.toUpperCase());put('coverage',h>0&&Number.isFinite(s)?Math.min(100,Math.max(0,s/h*100)).toFixed(0)+'%':'—');$('gf').classList.toggle('reverse',/export/i.test(status));$('gf').style.opacity=Math.abs(g)>.005?1:0;$('sf').style.opacity=s>.005?1:0}function graph(d,sun){let p=d.points.map(q=>({t:new Date(q.time).getTime(),s:kw(q.solar_kw),h:kw(q.home_kw)})).filter(q=>Number.isFinite(q.t)&&Number.isFinite(q.s)&&Number.isFinite(q.h)).sort((a,b)=>a.t-b.t);if(!p.length)return;let date=day.format(new Date(p.at(-1).t));p=p.filter(q=>day.format(new Date(q.t))===date);let c=$('chart');c.replaceChildren();let x=t=>400+hour(t)/24*478, max=Math.max(1,Math.ceil(Math.max(...p.flatMap(q=>[q.s,q.h])))),y=v=>292-Math.max(0,v)/max*220;for(let i=0;i<=4;i++){let v=max*i/4;node(c,'path',{d:`M400 ${y(v)} H878`,stroke:'#433340','stroke-width':1});node(c,'text',{x:395,y:y(v)+4,fill:'#cc99cc','font-size':15,'text-anchor':'end'},v.toFixed(1))}for(let i=0;i<=4;i++){let xx=400+i*478/4;node(c,'path',{d:`M${xx} 72 V292`,stroke:'#433340'});node(c,'text',{x:xx,y:310,fill:'#cc99cc','font-size':16,'text-anchor':'middle'},String(i*6).padStart(2,'0')+':00')}if(sun&&sun.date===date){for(let k of ['sunrise','sunset']){let xx=x(sun[k]);node(c,'path',{d:`M${xx} 72 V292`,stroke:'#cc7766','stroke-dasharray':'4 4'});node(c,'text',{x:xx,y:64,fill:'#cc7766','font-size':16,'text-anchor':'middle'},fmt.format(new Date(sun[k])))}}let totals=[0,0,0,0],covered=0;for(let key of ['s','h']){let path='';p.forEach((q,i)=>{path+=(i&&q.t-p[i-1].t<=10*60000?'L':'M')+x(q.t)+' '+y(q[key])+' '});node(c,'path',{d:path,stroke:key==='s'?'#ffaa55':'#cc99cc','stroke-width':2.5,fill:'none'})}for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i],dt=(b.t-a.t)/3600000;if(dt<=0||dt>1/6)continue;covered+=dt;totals[0]+=(a.s+b.s)/2*dt;totals[1]+=(a.h+b.h)/2*dt;let g1=a.h-a.s,g2=b.h-b.s;for(let j=0;j<2;j++){let u=(j? -1:1)*g1,v=(j?-1:1)*g2;totals[2+j]+=u*v>=0?(Math.max(0,u)+Math.max(0,v))*dt/2:Math.max(u,v)**2/(2*Math.abs(u-v))*dt}}if(covered>0){put('solarTotal',energy(totals[0]));put('homeTotal',energy(totals[1]));put('gridTotal',totals[2].toFixed(2)+' / '+totals[3].toFixed(2)+' kWh')}put('period',date+' · RECORDED INTERVAL TOTALS · '+fmt.format(new Date(p[0].t))+'–'+fmt.format(new Date(p.at(-1).t))+' · '+covered.toFixed(1)+' h covered')}
let busy=false;async function refresh(){if(busy)return;busy=true;try{let [a,b,c]=await Promise.allSettled(['latest.json','solar_today.json','sun_times.json'].map(read));if(a.status==='fulfilled')live(a.value);if(b.status==='fulfilled')graph(b.value,c.status==='fulfilled'?c.value:null)}finally{busy=false}}refresh();setInterval(refresh,30000);</script></body></html>
