<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Solar Dashboard</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #05070b;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
    }

    .container {
        width: 100vw;
        height: 100vh;
        padding: 28px;
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 24px;
    }

    .net-panel,
    .tile,
    .chart-card {
        background: #11151d;
        border: 1px solid #252c38;
        border-radius: 24px;
        box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }

    .net-panel {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 22px;
    }

    .net-track {
        position: relative;
        width: 54px;
        height: 86%;
        background: #202632;
        border-radius: 999px;
        overflow: hidden;
        border: 2px solid #303746;
    }

    .net-zero-line {
        position: absolute;
        left: -18px;
        right: -18px;
        top: 50%;
        height: 4px;
        background: #ffffff;
        opacity: 0.9;
        transform: translateY(-50%);
        z-index: 5;
        border-radius: 999px;
    }

    .net-fill {
        position: absolute;
        left: 0;
        width: 100%;
        height: 0%;
        z-index: 2;
        border-radius: 999px 999px 0 0;
        transition: height 0.5s ease, top 0.5s ease, bottom 0.5s ease, background 0.5s ease;
    }

    .chevron-layer {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        z-index: 4;
        pointer-events: none;
        overflow: hidden;
    }

    .chevron-layer.export {
        bottom: 50%;
    }

    .chevron-layer.import {
        top: 50%;
    }

    .chevron {
        position: absolute;
        left: 50%;
        width: 24px;
        height: 24px;
        transform: translateX(-50%) rotate(45deg);
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .chevron.export {
        border-left: 5px solid #22c55e;
        border-top: 5px solid #22c55e;
        filter: drop-shadow(0 0 5px rgba(34, 197, 94, 0.8));
    }

    .chevron.import {
        border-right: 5px solid #ef4444;
        border-bottom: 5px solid #ef4444;
        filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.8));
    }

    .content {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
        min-height: 0;
    }

    .top-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 18px;
        height: 29vh;
        min-height: 205px;
        max-height: 250px;
    }

    .tile {
        padding: 18px 22px;
        display: grid;
        grid-template-rows: 34px 76px 64px;
        justify-items: center;
        align-items: center;
        text-align: center;
    }

    .status-spacer {
        height: 34px;
    }

    .grid-status {
        font-size: 1.35vw;
        font-weight: 700;
        line-height: 1;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon {
        width: 66px;
        height: 66px;
        opacity: 0.95;
    }

    .icon-solar {
        color: #facc15;
    }

    .icon-home {
        color: #3b82f6;
    }

    .icon-grid {
        color: #a855f7;
    }

    .value {
        font-size: 3.7vw;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        white-space: nowrap;
    }

    .chart-card {
        flex: 1;
        padding: 10px 18px 14px 18px;
        min-height: 0;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    .error {
        position: absolute;
        top: 18px;
        right: 18px;
        color: #ff5555;
        font-size: 14px;
        z-index: 10;
    }
</style>
</head>

<body>

<div class="error" id="errorBox"></div>

<div class="container">

    <div class="net-panel">
        <div class="net-track">
            <div class="net-fill" id="netFill"></div>

            <div class="chevron-layer export" id="exportChevrons">
                <div class="chevron export"></div>
                <div class="chevron export"></div>
                <div class="chevron export"></div>
                <div class="chevron export"></div>
                <div class="chevron export"></div>
            </div>

            <div class="chevron-layer import" id="importChevrons">
                <div class="chevron import"></div>
                <div class="chevron import"></div>
                <div class="chevron import"></div>
                <div class="chevron import"></div>
                <div class="chevron import"></div>
            </div>

            <div class="net-zero-line"></div>
        </div>
    </div>

    <div class="content">

        <div class="top-row">

            <div class="tile">
                <div class="status-spacer"></div>

                <svg class="icon icon-solar" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="13" stroke="currentColor" stroke-width="4"/>
                    <line x1="32" y1="5" x2="32" y2="15" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <line x1="32" y1="49" x2="32" y2="59" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <line x1="5" y1="32" x2="15" y2="32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <line x1="49" y1="32" x2="59" y2="32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <line x1="13" y1="13" x2="20" y2="20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <line x1="44" y1="44" x2="51" y2="51" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <line x1="51" y1="13" x2="44" y2="20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <line x1="20" y1="44" x2="13" y2="51" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                </svg>

                <div class="value" id="solar">--</div>
            </div>

            <div class="tile">
                <div class="status-spacer"></div>

                <svg class="icon icon-home" viewBox="0 0 64 64" fill="none">
                    <path d="M10 31L32 12L54 31" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M17 29V53H47V29" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M27 53V39H37V53" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

                <div class="value" id="home">--</div>
            </div>

            <div class="tile">
                <div class="grid-status" id="gridStatus">--</div>

                <svg class="icon icon-grid" viewBox="0 0 64 64" fill="none">
                    <path d="M32 7L45 57" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path d="M32 7L19 57" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path d="M24 25H40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path d="M21 37H43" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path d="M17 57H47" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path d="M12 22L24 25" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path d="M52 22L40 25" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                </svg>

                <div class="value" id="grid">--</div>
            </div>

        </div>

        <div class="chart-card">
            <canvas id="solarChart"></canvas>
        </div>

    </div>

</div>

<script>

function formatKW(value) {
    return `${Number(value).toFixed(1)} kW`;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

async function loadLatest() {
    const response = await fetch(`./latest.json?t=${Date.now()}`);

    if (!response.ok) {
        throw new Error("Failed to load latest.json");
    }

    return await response.json();
}

async function loadSolarHistory() {
    const response = await fetch(`./solar_today.json?t=${Date.now()}`);

    if (!response.ok) {
        throw new Error("Failed to load solar_today.json");
    }

    return await response.json();
}

function updateTop(data) {
    document.getElementById("solar").innerText =
        formatKW(data.solar_kw);

    document.getElementById("home").innerText =
        formatKW(data.home_kw);

    document.getElementById("grid").innerText =
        formatKW(data.grid_kw);

    const status = document.getElementById("gridStatus");

    if (data.grid_status === "Exporting") {
        status.innerText = "Exporting";
        status.style.color = "#31f06c";
    } else {
        status.innerText = "Importing";
        status.style.color = "#ff4b4b";
    }

    updateNetBar(data.net_grid_kw);
}

function updateChevrons(net, percent) {
    const exportChevrons = Array.from(
        document.querySelectorAll("#exportChevrons .chevron")
    );

    const importChevrons = Array.from(
        document.querySelectorAll("#importChevrons .chevron")
    );

    exportChevrons.forEach(chevron => {
        chevron.style.opacity = "0";
    });

    importChevrons.forEach(chevron => {
        chevron.style.opacity = "0";
    });

    const activeCount = Math.floor(percent / 10);

    if (activeCount <= 0) {
        return;
    }

    if (net >= 0) {
        exportChevrons.forEach((chevron, index) => {
            if (index < activeCount) {
                chevron.style.opacity = "0.9";
                chevron.style.bottom = `${12 + index * 28}px`;
            }
        });
    } else {
        importChevrons.forEach((chevron, index) => {
            if (index < activeCount) {
                chevron.style.opacity = "0.9";
                chevron.style.top = `${12 + index * 28}px`;
            }
        });
    }
}

function updateNetBar(net) {
    const fill = document.getElementById("netFill");

    const limitedNet = clamp(net, -3, 3);

    const percent = Math.abs(limitedNet) / 3 * 50;

    fill.style.height = `${percent}%`;

    if (limitedNet >= 0) {
        fill.style.bottom = "50%";
        fill.style.top = "auto";
        fill.style.borderRadius = "999px 999px 0 0";

        fill.style.background =
            "linear-gradient(to top, #facc15 0%, #a3e635 45%, #22c55e 100%)";

        fill.style.boxShadow =
            "0 0 14px rgba(34, 197, 94, 0.75)";
    } else {
        fill.style.top = "50%";
        fill.style.bottom = "auto";
        fill.style.borderRadius = "0 0 999px 999px";

        fill.style.background =
            "linear-gradient(to bottom, #f97316 0%, #fb4b2b 45%, #ef4444 100%)";

        fill.style.boxShadow =
            "0 0 14px rgba(239, 68, 68, 0.75)";
    }

    updateChevrons(limitedNet, percent);
}

function drawSolarChart(points) {
    const canvas = document.getElementById("solarChart");
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const width = rect.width;
    const height = rect.height;

    ctx.clearRect(0, 0, width, height);

    const padding = {
        left: 54,
        right: 18,
        top: 16,
        bottom: 36
    };

    const chartWidth = width - padding.left - padding.right;
    const chartHeight = height - padding.top - padding.bottom;

    const maxKw = Math.max(
        1,
        Math.ceil(Math.max(...points.map(p => p.solar_kw), 1))
    );

    const startHour = 5;
    const endHour = 21;
    const totalHours = endHour - startHour;

    function xForTime(dateObj) {
        const hours = dateObj.getHours() + dateObj.getMinutes() / 60;
        return padding.left + ((hours - startHour) / totalHours) * chartWidth;
    }

    function yForValue(value) {
        return padding.top + chartHeight - (value / maxKw) * chartHeight;
    }

    ctx.strokeStyle = "#3a404c";
    ctx.lineWidth = 1;
    ctx.fillStyle = "#9aa3b2";
    ctx.font = "14px Arial";

    for (let i = 0; i <= maxKw; i++) {
        const y = yForValue(i);

        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();

        ctx.fillText(`${i}kW`, 6, y + 5);
    }

    for (let hour = 5; hour <= 21; hour += 2) {
        const x = padding.left + ((hour - startHour) / totalHours) * chartWidth;

        ctx.fillText(
            `${hour}:00`,
            x - 18,
            height - 10
        );
    }

    if (points.length === 0) {
        return;
    }

    ctx.beginPath();

    points.forEach((point, index) => {
        const dateObj = new Date(point.time);

        const x = xForTime(dateObj);
        const y = yForValue(point.solar_kw);

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    });

    const lastPoint = points[points.length - 1];
    const firstPoint = points[0];

    ctx.lineTo(
        xForTime(new Date(lastPoint.time)),
        padding.top + chartHeight
    );

    ctx.lineTo(
        xForTime(new Date(firstPoint.time)),
        padding.top + chartHeight
    );

    ctx.closePath();

    const gradient =
        ctx.createLinearGradient(
            0,
            padding.top,
            0,
            padding.top + chartHeight
        );

    gradient.addColorStop(0, "rgba(36, 184, 90, 0.75)");
    gradient.addColorStop(1, "rgba(36, 184, 90, 0.08)");

    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();

    points.forEach((point, index) => {
        const dateObj = new Date(point.time);

        const x = xForTime(dateObj);
        const y = yForValue(point.solar_kw);

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    });

    ctx.strokeStyle = "#24b85a";
    ctx.lineWidth = 4;
    ctx.stroke();
}

async function refreshDashboard() {
    try {
        const latest =
            await loadLatest();

        const solarHistory =
            await loadSolarHistory();

        updateTop(latest);

        drawSolarChart(
            solarHistory.points || []
        );

        document.getElementById("errorBox").innerText = "";

    } catch (error) {
        console.error(error);

        document.getElementById("errorBox").innerText =
            error.message;
    }
}

refreshDashboard();

setInterval(refreshDashboard, 60000);

window.addEventListener("resize", refreshDashboard);

</script>

</body>
</html>
